<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMA Drive Feature Matrix</title><style>body{font-family:system-ui;background:#0b1220;color:#f8fafc;margin:0;padding:20px}main{max-width:1100px;margin:auto}h1{margin-bottom:4px}.muted{color:#9ca3af}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.card{background:#111827;border:1px solid #ffffff14;border-radius:12px;padding:12px}.num{font-size:25px;font-weight:800}.working{color:#4ade80}.partial{color:#facc15}.engine_ready{color:#60a5fa}.external_blocker{color:#fb923c}.missing{color:#f87171}.bar{height:10px;background:#1f2937;border-radius:8px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#60a5fa}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{background:#172033;color:#fff;border:1px solid #ffffff20;border-radius:9px;padding:8px 10px;cursor:pointer}button.active{background:#2563eb}table{width:100%;border-collapse:collapse;background:#111827;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:9px;border-bottom:1px solid #ffffff10;font-size:13px}th{color:#9ca3af}.status{font-weight:700}</style><main><h1>NEMA Drive • 100 Özellik Matrisi</h1><div class="muted">Google Maps / Apple Maps / Yandex seviyesine göre gerçek durum. Motor hazır olması üretim verisinin bağlı olduğu anlamına gelmez.</div><section class="cards" id="cards"></section><div class="filter" id="filter"></div><table><thead><tr><th>#</th><th>Kategori</th><th>Özellik</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table></main><script>const S={working:'Çalışıyor',partial:'Kısmi',engine_ready:'Motor hazır',external_blocker:'Dış entegrasyon',missing:'Eksik'};const C={working:'working',partial:'partial',engine_ready:'engine_ready',external_blocker:'external_blocker',missing:'missing'};let data;let selected='all';async function load(){data=await fetch('navigation-feature-matrix.json').then(r=>r.json());render()}function render(){const f=data.features;const counts=Object.fromEntries(Object.keys(S).map(k=>[k,f.filter(x=>x.status===k).length]));const ready=counts.working+counts.partial*.5+counts.engine_ready*.7;document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">Çalışıyor</div><div class="num working">${counts.working}</div></div><div class="card"><div class="muted">Kısmi</div><div class="num partial">${counts.partial}</div></div><div class="card"><div class="muted">Motor hazır</div><div class="num engine_ready">${counts.engine_ready}</div></div><div class="card"><div class="muted">Dış entegrasyon</div><div class="num external_blocker">${counts.external_blocker}</div></div><div class="card"><div class="muted">Eksik</div><div class="num missing">${counts.missing}</div><div class="bar"><div class="fill" style="width:${Math.round(ready)}%"></div></div></div>`;const cats=['all',...new Set(f.map(x=>x.category))];document.getElementById('filter').innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" onclick="selected='${c}';render()">${c==='all'?'Tümü':c}</button>`).join('');const rows=selected==='all'?f:f.filter(x=>x.category===selected);document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${x.id}</td><td>${x.category}</td><td>${x.name}</td><td class="status ${C[x.status]}">${S[x.status]}</td></tr>`).join('')}load();</script></html>
