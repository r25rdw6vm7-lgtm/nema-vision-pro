<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMA Drive Test</title><body style="font-family:system-ui;background:#0b1220;color:#fff;padding:20px"><h1>NEMA Drive Test Engine</h1><pre id="out">Testler çalışıyor…</pre><script src="navigation-core.js"></script><script src="map-provider.js"></script><script src="route-provider.js"></script><script src="traffic-lights.js"></script><script src="navigation-data-providers.js"></script><script src="navigation-intelligence.js"></script><script src="navigation-voice.js"></script><script src="nema-drive-enhancements.js"></script><script src="navigation-runtime-bridge.js"></script><script src="navigation-live-data.js"></script><script src="navigation-ui-runtime.js"></script><script>
const out=document.getElementById('out'),results=[];function t(name,fn){try{if(!fn())throw Error('FAIL');results.push('PASS  '+name)}catch(e){results.push('FAIL  '+name+' • '+e.message)}}
t('Green Wave yasal limit ile sınırlandırılır',()=>{const r=NEMATrafficLights.optimize([{distanceM:500,phase:'red',remainingSec:12,greenDurationSec:30,speedLimitKmh:50}],30,50);return r.speedWindowKmh&&r.speedWindowKmh[1]<=50});
t('Rota sapması hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};return NEMADriveEnhancements.routeDistanceM({lat:39.92,lon:32.8505},g)<100});
t('Rota dışı eşiği çalışır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};return NEMADriveEnhancements.checkOffRoute({lat:39.93,lon:32.86},g,65).offRoute});
t('Türkçe ses komutu üretilir',()=>NEMADriveEnhancements.instructionForStep({name:'Atatürk Caddesi',maneuver:{type:'turn',modifier:'right'}},350)==='350 metre sonra sağa dönün');
t('Merkezi ses motoru kullanılabilir',()=>NEMAVoice.state.enabled&&typeof NEMAVoice.speak==='function');
t('Hız limiti ses metni güvenli biçimde güncellenir',()=>{NEMAVoice.reset();return NEMAVoice.state.limitValue===null&&typeof NEMAVoice.speedLimit==='function'});
t('Hız dönüşümü ve ışık varışı',()=>Math.round(NEMATrafficLights.arrivalAt(100,50)*10)/10===7.2);
t('Hız limiti normalizasyonu',()=>NEMADataProviders.normalizeSpeedLimit({speedLimitKmh:50,source:'DEMO',confidence:'demo'}).value===50);
t('EDS verisi normalize edilir',()=>NEMADataProviders.normalizeEnforcement({type:'eds',distanceM:720,limitKmh:50,source:'DEMO',confidence:'demo'}).distanceM===720);
t('Trafik verisi normalize edilir',()=>NEMADataProviders.normalizeTraffic({level:'moderate',delaySec:90,speedKmh:38,source:'DEMO'}).delaySec===90);
t('Demo veri paketi dört katmanı besler',()=>{const r=NEMADataProviders.demo();return r.speedLimit?.value===50&&r.enforcement.length===1&&r.signals.length===3&&r.traffic?.level==='moderate'});
t('Rota toplam uzunluğu hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921],[32.852,39.922]]};return NEMANavigationIntelligence.routeLength({geometry:g})>200});
t('Rota ilerleme yüzdesi hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};const q=NEMANavigationIntelligence.nearestProgress({lat:39.9205,lon:32.8505},{geometry:g});return q.alongM>0&&q.alongM<q.totalM});
t('Veri tazelik kontrolü çalışır',()=>NEMANavigationIntelligence.dataHealth({updatedAt:Date.now()},120000).status==='fresh');
t('Sürüş güvenliği hız limitini aşmayı işaretler',()=>NEMANavigationIntelligence.drivingSafety(92,90).status==='near-limit');
t('Reroute cooldown güvenlik kilidi',()=>{const s=NEMANavigationIntelligence.state;return NEMANavigationIntelligence.rerouteAllowed(Date.now(),15000)&&s.reroutePending===false});
t('Koordinat doğrulama geçersiz veriyi reddeder',()=>NEMARouteProvider.validPoint({lat:91,lon:32})===false&&NEMARouteProvider.validPoint({lat:39.92,lon:32.85})===true);
t('Rota kalite motoru eksik geometriyi işaretler',()=>NEMARouteProvider.routeQuality({distanceM:1200,durationSec:90,geometry:null,steps:[]}).usable===false);
t('Rota kalite motoru kullanılabilir rotayı kabul eder',()=>NEMARouteProvider.routeQuality({distanceM:1200,durationSec:90,geometry:{type:'LineString',coordinates:[[32.85,39.92],[32.86,39.93]]},steps:[{}],trafficAware:true,confidence:'provider'}).usable===true);
t('Rota sağlayıcı fallback yapılandırması çalışır',()=>{const s=NEMARouteProvider.configure({primary:'osrm',fallbacks:['osrm']});return s.primary==='osrm'&&s.fallbacks[0]==='osrm'});
t('Navigasyon hız önerisi yasal limitin altında kalır',()=>NEMANavigation.recommendedLegalSpeed(50,3)===47);
t('Veri güven skoru OSM için sınırlıdır',()=>{const x=NEMANavigation.normalizeSpeedLimit({value:90,source:'OSM',confidence:'map',updatedAt:Date.now()});return x?.confidenceScore===72});
t('Veri sağlık motoru güven skorunu üretir',()=>{NEMANavigation.setSpeedLimit({value:90,source:'OSM',confidence:'map'});const h=NEMANavigation.dataHealth();return h.confidenceScore>=70});
t('Ortalama hız koridoru normalizasyonu çalışır',()=>{const c=NEMANavigation.normalizeAverageSpeedCorridor({id:'avg-1',limitKmh:90,lengthM:10000,source:'OFFICIAL',confidence:'verified',verified:true});return c&&c.limitKmh===90&&c.lengthM===10000&&c.verified===true});
t('Ortalama hız hesabı yasal sınırda çalışır',()=>{const c={limitKmh:90,lengthM:10000,source:'OFFICIAL',confidence:'verified',verified:true};const r=NEMANavigation.averageSpeedStatus(c,400,10000);return r.status==='within-limit'&&r.averageKmh===90});
t('Ortalama hız aşımı yakalanır',()=>{const c={limitKmh:90,lengthM:10000};return NEMANavigation.averageSpeedStatus(c,350,10000).status==='over-limit'});
t('Ortalama hız motoru hız artırma önerisi üretmez',()=>{const c={limitKmh:90,lengthM:10000};const r=NEMANavigation.averageSpeedStatus(c,600,5000);return r.status==='within-limit'&&r.projectedKmh===30});
t('Doğrulanmış en yakın denetim seçilir',()=>{NEMANavigation.setEnforcement([{type:'eds',distanceM:800,verified:false},{type:'eds',distanceM:1200,verified:true}]);return NEMANavigation.nearestEnforcement(5000,{verifiedOnly:true})?.distanceM===1200});
t('Hedef konumu merkezi state içinde tutulur',()=>NEMANavigation.setDestination({lat:39.92,lon:32.85,label:'Test'})?.lat===39.92&&NEMANavigation.state.destination?.lon===32.85);
t('Canlı rota özeti destination ile birlikte çalışır',()=>{NEMANavigation.setRoute({distanceM:1000,durationSec:80,geometry:{type:'LineString',coordinates:[[32.85,39.92],[32.86,39.93]]},provider:'TEST',confidence:'provider'});const s=NEMANavigation.routeSummary(50);return s&&s.distanceM===1000&&s.liveEtaSec===72&&s.destination?.lat===39.92});
t('Adaptive rota sapma eşiği GPS doğruluğunu dikkate alır',()=>NEMANavigationIntelligence.deviationThreshold({accuracyM:40},{confidence:'provider'})===100});
t('Runtime bridge API kullanılabilir',()=>typeof NEMANavigationRuntime?.updatePosition==='function'&&typeof NEMANavigationRuntime?.updateVoice==='function');
t('UI runtime motoru kullanılabilir',()=>typeof NEMAUIRuntime?.render==='function');
t('Runtime bridge güvenli reroute için destination kullanır',()=>NEMANavigation.state.destination?.lat===39.92&&NEMANavigationIntelligence.state.reroutePending===false);
t('Veri sağlık motoru taze veriyi kabul eder',()=>NEMANavigation.dataHealth(120000).status==='fresh');
t('Canlı veri katmanı yüklenmiş',()=>typeof NEMALiveData?.syncPosition==='function'&&typeof NEMALiveData?.parseMaxspeed==='function');
t('OSM hız limiti 50 parse edilir',()=>NEMALiveData.parseMaxspeed('50 km/h')===50);
t('OSM mph hız limiti km/sa çevrilir',()=>NEMALiveData.parseMaxspeed('30 mph')===48);
t('Geçersiz hız limiti reddedilir',()=>NEMALiveData.parseMaxspeed('signals')===null);
t('Bilinmeyen hız limiti reddedilir',()=>NEMALiveData.parseMaxspeed('unknown')===null);
out.textContent=results.join('\n')+'\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' test başarılı.\n\nNot: Bu tarayıcı testleri canlı trafik, resmi EDS yetkili veri kaynağı, gerçek araç Bluetooth veya native iOS HERE/Mapbox SDK entegrasyonunu doğrulamaz. OSM hız/kamera/sinyal konumları harita verisidir ve resmi doğrulama yerine geçmez.';
</script></body></html>
