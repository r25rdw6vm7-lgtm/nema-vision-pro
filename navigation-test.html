<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMA Drive Test</title><body style="font-family:system-ui;background:#0b1220;color:#fff;padding:20px"><h1>NEMA Drive Test Engine</h1><pre id="out">Testler çalışıyor…</pre><script src="navigation-core.js"></script><script src="map-provider.js"></script><script src="route-provider.js"></script><script src="traffic-lights.js"></script><script src="navigation-advanced-engine.js"></script><script src="navigation-data-providers.js"></script><script src="speed-limit-engine.js"></script><script src="enforcement-engine.js"></script><script src="traffic-engine.js"></script><script src="navigation-intelligence.js"></script><script src="navigation-voice.js"></script><script src="nema-drive-enhancements.js"></script><script src="navigation-runtime-bridge.js"></script><script src="navigation-live-data.js"></script><script src="navigation-ui-runtime.js"></script><script src="navigation-incident-ui.js"></script><script src="navigation-vision-engine.js"></script><script src="navigation-sharing.js"></script><script src="navigation-ev-engine.js"></script><script>
const out=document.getElementById('out'),results=[];function t(name,fn){try{if(!fn())throw Error('FAIL');results.push('PASS  '+name)}catch(e){results.push('FAIL  '+name+' • '+e.message)}}
t('Green Wave yasal limit ile sınırlandırılır',()=>{const r=NEMATrafficLights.optimize([{distanceM:500,phase:'red',remainingSec:12,greenDurationSec:30,speedLimitKmh:50}],30,50);return r.speedWindowKmh&&r.speedWindowKmh[1]<=50});
t('Incident normalize',()=>NEMAIncidentUI.normalize({lat:39.9,lon:32.8,type:'hazard'}).type==='hazard');
t('Vision invalid data güvenli reddedilir',()=>NEMAVision.state.detections.length===0);t('Route share round-trip',()=>NEMARouteSharing.decode(NEMARouteSharing.encode({destination:{name:'Ankara'}})).destination.name==='Ankara');
NEMAEV.configure({batteryKWh:60,chargeKWh:50,consumptionKWh100:15});t('EV energy estimate',()=>NEMAEV.estimate(200000).known);t('EV charging stop selection',()=>NEMAEV.plan({distanceM:200000},[{id:'c1',distanceM:50000}]).chargingStop?.id==='c1');
out.textContent=results.join('\n')+'\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' PASS';
</script></html>
