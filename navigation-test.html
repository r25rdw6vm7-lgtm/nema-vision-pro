<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMA Drive Test</title><body style="font-family:system-ui;background:#0b1220;color:#fff;padding:20px"><h1>NEMA Drive Test Engine</h1><pre id="out">Testler çalışıyor…</pre><script src="navigation-core.js"></script><script src="map-provider.js"></script><script src="route-provider.js"></script><script src="traffic-lights.js"></script><script src="navigation-advanced-engine.js"></script><script src="navigation-data-providers.js"></script><script src="speed-limit-engine.js"></script><script src="enforcement-engine.js"></script><script src="traffic-engine.js"></script><script src="navigation-intelligence.js"></script><script src="navigation-voice.js"></script><script src="nema-drive-enhancements.js"></script><script src="navigation-runtime-bridge.js"></script><script src="navigation-live-data.js"></script><script src="navigation-ui-runtime.js"></script><script>
const out=document.getElementById('out'),results=[];function t(name,fn){try{if(!fn())throw Error('FAIL');results.push('PASS  '+name)}catch(e){results.push('FAIL  '+name+' • '+e.message)}}
t('Green Wave yasal limit ile sınırlandırılır',()=>{const r=NEMATrafficLights.optimize([{distanceM:500,phase:'red',remainingSec:12,greenDurationSec:30,speedLimitKmh:50}],30,50);return r.speedWindowKmh&&r.speedWindowKmh[1]<=50});
t('Speed limit kaynak önceliği official > map',()=>{const now=Date.now();NEMASpeedLimitEngine.ingest([{value:50,source:'OSM',confidence:'map',updatedAt:now},{value:70,source:'provider',confidence:'verified',updatedAt:now},{value:80,source:'official',confidence:'official',updatedAt:now}]);return NEMASpeedLimitEngine.resolve().value===80});
t('Speed limit stale veri elenir',()=>{NEMASpeedLimitEngine.ingest({value:50,source:'map',confidence:'map',updatedAt:Date.now()-400000});return NEMASpeedLimitEngine.resolve()===null});
t('Speed limit yön uyumu çalışır',()=>{const now=Date.now();NEMASpeedLimitEngine.ingest([{value:50,direction:'forward',updatedAt:now},{value:70,direction:'backward',updatedAt:now}]);return NEMASpeedLimitEngine.resolve({direction:'backward'}).value===70});
t('Enforcement yön ve doğrulama filtresi çalışır',()=>{NEMAEnforcementEngine.ingest([{type:'eds',distanceM:500,direction:'forward',verified:false},{type:'eds',distanceM:900,direction:'backward',verified:true}]);return NEMAEnforcementEngine.nearest({direction:'backward',verifiedOnly:true}).distanceM===900});
t('Average-speed koridor yaşam döngüsü çalışır',()=>{NEMAEnforcementEngine.ingest({id:'avg-1',type:'average-speed',distanceM:0,lengthM:10000,limitKmh:90,verified:true});const c=NEMAEnforcementEngine.state.items[0];return NEMAEnforcementEngine.corridorLifecycle(c,5000,180).status==='over-limit'});
t('Traffic unknown ETA etkisi üretmez',()=>{NEMATrafficEngine.ingest({level:'unknown',source:'unknown'});const r=NEMATrafficEngine.applyToRoute({distanceM:1000,durationSec:100});return r.trafficAware===false&&r.durationSec===100});
t('Traffic delay rotaya uygulanır',()=>{NEMATrafficEngine.ingest({level:'moderate',delaySec:40,source:'provider',confidence:'verified',live:true});const r=NEMATrafficEngine.applyToRoute({distanceM:1000,durationSec:100});return r.trafficAware===true&&r.durationSec===140});
t('Rota tercihleri ve alternatif sıralama çalışır',()=>{NEMAAdvancedNavigation.setPreferences({mode:'fastest',avoidTolls:true});const r=NEMAAdvancedNavigation.chooseRoute([{distanceM:30000,durationSec:1800,tollCost:0},{distanceM:28000,durationSec:1500,tollCost:80}]);return r.selected&&r.selected.tollCost===0});
t('Çoklu durak yönetimi çalışır',()=>{NEMAAdvancedNavigation.setWaypoints([{lat:39.92,lon:32.85,label:'A'},{lat:39.93,lon:32.86,label:'B'}]);return NEMAAdvancedNavigation.state.waypoints.length===2});
t('Olay normalizasyonu ve topluluk bildirimi çalışır',()=>{const r=NEMAAdvancedNavigation.reportIncident({type:'hazard',lat:39.92,lon:32.85,message:'Test'});return r&&r.verified===false&&NEMAAdvancedNavigation.state.reports.length===1});
t('Şerit rehberliği veri modeli çalışır',()=>{const r=NEMAAdvancedNavigation.laneGuidance([{allowed:['straight'],confidence:'high'},{allowed:['right'],confidence:'high'}],1);return r.recommendedIndex===1&&r.lanes.length===2});
t('Landmark yönlendirme veri modeli çalışır',()=>{const r=NEMAAdvancedNavigation.landmarkGuidance([{name:'Market',distanceM:120}],{lat:39.92,lon:32.85});return r.next.name==='Market'});
t('Enerji tahmini çalışır',()=>{const r=NEMAAdvancedNavigation.energyEstimate({distanceM:10000,elevationGainM:100,consumptionPer100:18,batteryKwh:60});return r.energyKwh>0});
t('Rota sapması hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};return NEMADriveEnhancements.routeDistanceM({lat:39.92,lon:32.8505},g)<100});
t('Rota dışı eşiği çalışır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};return NEMADriveEnhancements.checkOffRoute({lat:39.93,lon:32.86},g,65).offRoute});
t('Türkçe ses komutu üretilir',()=>NEMADriveEnhancements.instructionForStep({name:'Atatürk Caddesi',maneuver:{type:'turn',modifier:'right'}},350)==='350 metre sonra sağa dönün');
t('Merkezi ses motoru kullanılabilir',()=>NEMAVoice.state.enabled&&typeof NEMAVoice.speak==='function');
t('Hız limiti ses metni güvenli biçimde güncellenir',()=>{NEMAVoice.reset();return NEMAVoice.state.limitValue===null&&typeof NEMAVoice.speedLimit==='function'});
t('Hız dönüşümü ve ışık varışı',()=>Math.round(NEMATrafficLights.arrivalAt(100,50)*10)/10===7.2);
t('Rota toplam uzunluğu hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921],[32.852,39.922]]};return NEMANavigationIntelligence.routeLength({geometry:g})>200});
t('Rota ilerleme yüzdesi hesaplanır',()=>{const g={type:'LineString',coordinates:[[32.85,39.92],[32.851,39.921]]};const q=NEMANavigationIntelligence.nearestProgress({lat:39.9205,lon:32.8505},{geometry:g});return q.alongM>0&&q.alongM<q.totalM});
t('Veri tazelik kontrolü çalışır',()=>NEMANavigationIntelligence.dataHealth({updatedAt:Date.now()},120000).status==='fresh');
t('Reroute cooldown güvenlik kilidi',()=>{const s=NEMANavigationIntelligence.state;return NEMANavigationIntelligence.rerouteAllowed(Date.now(),15000)&&s.reroutePending===false});
t('Koordinat doğrulama geçersiz veriyi reddeder',()=>NEMARouteProvider.validPoint({lat:91,lon:32})===false&&NEMARouteProvider.validPoint({lat:39.92,lon:32.85})===true);
t('Rota kalite motoru eksik geometriyi işaretler',()=>NEMARouteProvider.routeQuality({distanceM:1200,durationSec:90,geometry:null,steps:[]}).usable===false);
t('Rota kalite motoru kullanılabilir rotayı kabul eder',()=>NEMARouteProvider.routeQuality({distanceM:1200,durationSec:90,geometry:{type:'LineString',coordinates:[[32.85,39.92],[32.86,39.93]]},steps:[{}],trafficAware:true,confidence:'provider'}).usable===true);
t('Navigasyon hız önerisi yasal limitin altında kalır',()=>NEMANavigation.recommendedLegalSpeed(50,3)===47);
t('Veri güven skoru OSM için sınırlıdır',()=>{const x=NEMANavigation.normalizeSpeedLimit({value:90,source:'OSM',confidence:'map',updatedAt:Date.now()});return x?.confidenceScore===72});
t('Ortalama hız koridoru normalizasyonu çalışır',()=>{const c=NEMANavigation.normalizeAverageSpeedCorridor({id:'avg-1',limitKmh:90,lengthM:10000,source:'OFFICIAL',confidence:'verified',verified:true});return c&&c.limitKmh===90&&c.lengthM===10000&&c.verified===true});
t('Ortalama hız hesabı yasal sınırda çalışır',()=>{const c={limitKmh:90,lengthM:10000,source:'OFFICIAL',confidence:'verified',verified:true};const r=NEMANavigation.averageSpeedStatus(c,400,10000);return r.status==='within-limit'&&r.averageKmh===90});
t('GPS hız yumuşatma ani sıçramayı azaltır',()=>{NEMANavigation.setPosition({lat:39.92,lon:32.85,speedKmh:0,accuracyM:8});const p=NEMANavigation.setPosition({lat:39.9201,lon:32.8501,speedKmh:120,accuracyM:8});return p.speedKmh<120&&p.speedKmh>0&&p.rawSpeedKmh===120});
out.textContent=results.join('\n')+'\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' test başarılı.\n\nNot: Bu tarayıcı testleri canlı trafik, resmi EDS yetkili veri kaynağı, gerçek araç Bluetooth veya native iOS/Android SDK entegrasyonunu doğrulamaz. OSM verileri resmi doğrulama yerine geçmez.';
</script></body></html>
