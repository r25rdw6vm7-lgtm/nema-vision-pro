<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEMA Drive Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1220;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}button,input{font:inherit}#app{height:100%;display:flex;flex-direction:column}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px}.search{flex:1;background:#111827eF;border:1px solid #ffffff1c;color:#fff;border-radius:16px;padding:13px 15px;outline:none;backdrop-filter:blur(12px)}.btn{border:1px solid #ffffff22;background:#111827eF;color:#fff;border-radius:14px;padding:0 14px;min-width:48px;min-height:48px;font-weight:700}.mapwrap{position:relative;flex:1;min-height:420px}.map{position:absolute;inset:0}.bottom{position:absolute;z-index:1000;left:12px;right:12px;bottom:12px;background:#0b1220ec;border:1px solid #ffffff18;border-radius:24px;padding:14px;backdrop-filter:blur(16px)}.maneuver{display:flex;align-items:center;gap:12px}.arrow{width:48px;height:48px;border-radius:15px;background:#2563eb;display:grid;place-items:center;font-size:25px;font-weight:900}.next{font-size:17px;font-weight:800}.sub{font-size:12px;color:#aeb8c8;margin-top:3px}.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:12px}.stat{background:#172033;border-radius:15px;padding:10px}.small{font-size:10px;color:#9aa6b8;text-transform:uppercase;letter-spacing:.06em}.big{font-size:19px;font-weight:800;margin-top:3px}.speedrow{display:flex;align-items:end;justify-content:space-between;margin-top:12px}.speed{font-size:48px;font-weight:900;line-height:.9}.limit{font-size:24px;font-weight:900}.warn{margin-top:10px;padding:11px 12px;border-radius:14px;background:#06351f;border:1px solid #166534;color:#bbf7d0;font-weight:750;font-size:13px}.warn.alert{background:#451a03;border-color:#92400e;color:#fed7aa}.layers{position:absolute;z-index:1000;right:12px;top:72px;display:flex;gap:7px}.layer{background:#111827eF;border:1px solid #ffffff20;color:#fff;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:750}.leaflet-control-attribution{font-size:9px}.camera-icon{background:#111827;border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:15px}.user-icon{background:#2563eb;border:4px solid #fff;border-radius:50%;width:24px;height:24px;box-shadow:0 2px 8px #0008}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:span 2}.bottom{padding:12px}.search{min-width:0}.layers{top:70px;flex-wrap:wrap;justify-content:flex-end;width:180px}}
</style></head>
<body><div id="app"><div class="mapwrap"><div id="map" class="map"></div><div class="top"><input id="search" class="search" placeholder="Nereye gitmek istiyorsunuz?" aria-label="Hedef ara"><button id="go" class="btn" type="button">Git</button></div><div class="layers"><button class="layer" id="hybrid" type="button">🛰️ Uydu</button><button class="layer" id="traffic" type="button">🚦 Trafik</button><button class="layer" id="locate" type="button">⌖ Konum</button></div><section class="bottom" aria-live="polite"><div class="maneuver"><div class="arrow">↑</div><div><div class="next" id="next">1,4 km sonra düz devam</div><div class="sub" id="route">Rota hazırlanıyor • GPS bekleniyor</div></div></div><div class="speedrow"><div><div class="small">Anlık hız</div><div class="speed"><span id="speed">--</span> <span style="font-size:16px;color:#aeb8c8">km/s</span></div></div><div style="text-align:right"><div class="small">Hız limiti</div><div class="limit"><span id="limit">--</span> km/s</div></div></div><div class="stats"><div class="stat"><div class="small">ETA</div><div class="big" id="eta">--</div></div><div class="stat"><div class="small">Mesafe</div><div class="big" id="distance">--</div></div><div class="stat"><div class="small">EDS / Denetim</div><div class="big" id="camera">Veri bekleniyor</div></div></div><div id="warning" class="warn">GPS başlatılıyor. Gerçek sürüşte hız ve limit verilerini doğrulayın.</div></section></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([39.92,32.85],12);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
const labels=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© CARTO'});
let satelliteOn=false,trafficOn=false,userMarker=null,accuracyCircle=null,lastPos=null,lastTime=null,speed=0,limit=90;
const demoCameras=[];
function setText(id,v){document.getElementById(id).textContent=v}
function showWarning(){const w=document.getElementById('warning');w.className='warn';if(speed>limit+2){w.className='warn alert';w.textContent='⚠ Hız limitin üzerinde. Lütfen yasal hız sınırına uyun.'}else{w.textContent='✓ Hızınız mevcut hız limiti içinde.'}}
function updateSpeed(position){const c=position.coords;let gpsSpeed=Number.isFinite(c.speed)&&c.speed>=0?c.speed*3.6:null;if(gpsSpeed===null&&lastPos&&lastTime){const R=6371000,lat1=lastPos.lat*Math.PI/180,lat2=c.latitude*Math.PI/180,dlat=(c.latitude-lastPos.lat)*Math.PI/180,dlon=(c.longitude-lastPos.lon)*Math.PI/180;const a=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;const meters=2*R*Math.asin(Math.sqrt(a));const secs=(performance.now()-lastTime)/1000;if(secs>0&&meters<500)gpsSpeed=meters/secs*3.6}if(gpsSpeed!==null)speed=Math.max(0,Math.round(gpsSpeed));setText('speed',speed||'0');setText('limit',limit);showWarning();lastPos={lat:c.latitude,lon:c.longitude};lastTime=performance.now();}
function onPosition(p){const c=p.coords;updateSpeed(p);if(!userMarker){userMarker=L.marker([c.latitude,c.longitude],{icon:L.divIcon({className:'',html:'<div class="user-icon"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map)}else userMarker.setLatLng([c.latitude,c.longitude]);if(accuracyCircle){accuracyCircle.setLatLng([c.latitude,c.longitude]).setRadius(c.accuracy||30)}else accuracyCircle=L.circle([c.latitude,c.longitude],{radius:c.accuracy||30,weight:1,fillOpacity:.08}).addTo(map);if(!lastPos||map.getZoom()<14)map.setView([c.latitude,c.longitude],15);setText('route','GPS aktif • doğruluk ±'+Math.round(c.accuracy||0)+' m');}
function onError(e){setText('route','GPS kullanılamıyor: '+e.message);document.getElementById('warning').textContent='GPS erişimi gerekli. HTTPS üzerinden konum izni verin.';document.getElementById('warning').className='warn alert'}
if(navigator.geolocation){navigator.geolocation.watchPosition(onPosition,onError,{enableHighAccuracy:true,maximumAge:2000,timeout:10000})}
function searchPlace(){const q=document.getElementById('search').value.trim();if(!q)return;setText('route','Hedef aranıyor…');fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tr&q='+encodeURIComponent(q),{headers:{'Accept-Language':'tr'}}).then(r=>r.json()).then(a=>{if(!a.length){setText('route','Hedef bulunamadı');return}const p=a[0];const lat=+p.lat,lon=+p.lon;map.setView([lat,lon],16);L.marker([lat,lon]).addTo(map).bindPopup(p.display_name).openPopup();setText('next','Hedef: '+(p.display_name.split(',')[0]||q));setText('distance','—');setText('eta','—');}).catch(()=>setText('route','Hedef arama başarısız'))}
document.getElementById('go').addEventListener('click',searchPlace);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
document.getElementById('hybrid').addEventListener('click',()=>{satelliteOn=!satelliteOn;if(satelliteOn){map.removeLayer(street);satellite.addTo(map);labels.addTo(map)}else{map.removeLayer(satellite);map.removeLayer(labels);street.addTo(map)}});
document.getElementById('locate').addEventListener('click',()=>{if(userMarker)map.setView(userMarker.getLatLng(),16);else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(onPosition,onError,{enableHighAccuracy:true})});
document.getElementById('traffic').addEventListener('click',()=>{trafficOn=!trafficOn;setText('camera',trafficOn?'Canlı trafik katmanı API bekliyor':'Veri bekleniyor');document.getElementById('traffic').style.background=trafficOn?'#1d4ed8':'#111827eF'});
setText('eta','--');setText('distance','--');setText('camera','Doğrulanmış veri');showWarning();
</script></body></html>
