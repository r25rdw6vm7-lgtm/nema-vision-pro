name: NEMA Drive Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON and feature matrix
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('navigation-feature-matrix.json','utf8'));
          if(m.schemaVersion!==3 || !Array.isArray(m.features) || m.features.length!==100) process.exit(1);
          const allowed=new Set(['working','partial','engine_ready','external_blocker','missing']);
          for(const x of m.features){if(!allowed.has(x.status)||!x.id||!x.category||!x.name) process.exit(1);}
          if(new Set(m.features.map(x=>x.id)).size!==100) process.exit(1);
          console.log('Feature matrix OK: 100 rows, schema v3');
          NODE
      - name: Validate Turkey offline manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./data/turkey-offline-manifest.json'); if(m.region!=='TR'||m.policy.neverTreatRawPbfAsRoutable!==true) process.exit(1); console.log('Turkey manifest policy OK')"
      - name: Validate offline safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Gerçek offline rota motoru bağlı değil" nema-drive-offline-routing.js
          grep -q "offline: false\|offlineReady: false" map-provider.js
          test "$(find . -type f -name '*.osm.pbf' -not -path './.git/*' | wc -l)" -eq 0
      - name: Validate required navigation files
        shell: bash
        run: |
          set -euo pipefail
          for f in nema-drive-offline-routing.js nema-native-bridge.js nema-here-native-contract.js nema-platform-orchestrator.js navigation-advanced-engine.js navigation-model-v2.js navigation-poi-engine.js navigation-personalization.js navigation-data-contracts.js navigation-incident-ui.js navigation-vision-engine.js navigation-sharing.js navigation-ev-engine.js nema-predictive-engine.js nema-spatial-engine.js nema-confidence-engine.js nema-ai-assistant.js navigation-ui-advanced.js navigation-platform-test.html navigation-advanced-test.html data/turkey-offline-manifest.json; do test -f "$f"; done
      - name: Run unified platform smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['nema-predictive-engine.js','nema-spatial-engine.js','nema-confidence-engine.js','nema-ai-assistant.js','nema-platform-orchestrator.js'];
          const context={window:{},Date,Math,Number,console,CustomEvent:function(){}}; vm.createContext(context);
          for(const f of files) vm.runInContext(fs.readFileSync(f,'utf8'),context,{filename:f});
          const w=context.window;
          w.NEMAPredictive.ingest({speedKmh:30,delaySec:40,confidence:90,timestamp:Date.now()});
          if(!w.NEMAPredictive.predict()) throw new Error('predictive engine failed');
          w.NEMASpatial.ingest([{id:'x',type:'landmark',distanceM:80,name:'Kavşak'}]);
          if(!w.NEMASpatial.instruction()) throw new Error('spatial engine failed');
          w.NEMAConfidence.set('gps',95); w.NEMAConfidence.set('route',90);
          if(w.NEMAConfidence.status().score!==93) throw new Error('confidence engine failed');
          if(w.NEMAAssistant.parse('alternatif rota göster').intent!=='alternative') throw new Error('assistant parser failed');
          if(w.NEMAPlatform.health().loaded<4) throw new Error('platform orchestrator failed');
          console.log('Unified NEMA platform smoke test OK');
          NODE
