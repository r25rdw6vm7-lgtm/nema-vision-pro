name: NEMA Drive Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON and feature matrix
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('navigation-feature-matrix.json','utf8'));
          if(m.schemaVersion!==3 || !Array.isArray(m.features) || m.features.length!==100) process.exit(1);
          const allowed=new Set(['working','partial','engine_ready','external_blocker','missing']);
          for(const x of m.features){if(!allowed.has(x.status)||!x.id||!x.category||!x.name) process.exit(1);}
          const ids=new Set(m.features.map(x=>x.id));
          if(ids.size!==100) process.exit(1);
          console.log('Feature matrix OK: 100 rows, schema v3');
          NODE

      - name: Validate Turkey offline manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./data/turkey-offline-manifest.json'); if(m.region!=='TR'||m.policy.neverTreatRawPbfAsRoutable!==true) process.exit(1); console.log('Turkey manifest policy OK')"

      - name: Validate offline safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Gerçek offline rota motoru bağlı değil" nema-drive-offline-routing.js
          grep -q "offline: false\|offlineReady: false" map-provider.js
          test "$(find . -type f -name '*.osm.pbf' -not -path './.git/*' | wc -l)" -eq 0

      - name: Validate required navigation files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            nema-drive-offline-routing.js \
            nema-native-bridge.js \
            nema-here-native-contract.js \
            navigation-advanced-engine.js \
            navigation-model-v2.js \
            navigation-poi-engine.js \
            navigation-personalization.js \
            navigation-data-contracts.js \
            navigation-incident-ui.js \
            navigation-vision-engine.js \
            navigation-sharing.js \
            navigation-ev-engine.js \
            navigation-predictive-engine.js \
            navigation-spatial-engine.js \
            navigation-confidence-engine.js \
            navigation-ai-assistant.js \
            navigation-test-engine-v2.html \
            navigation-ui-advanced.js \
            navigation-advanced-test.html \
            data/turkey-offline-manifest.json; do
            test -f "$f"
          done

      - name: Run navigation engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const files=['navigation-predictive-engine.js','navigation-spatial-engine.js','navigation-confidence-engine.js','navigation-ai-assistant.js'];
          const context={window:{},Date,Math,Number,console};
          vm.createContext(context);
          for(const f of files) vm.runInContext(fs.readFileSync(f,'utf8'),context,{filename:f});
          const w=context.window;
          w.NEMAPredictive.ingestSegments([{id:'a',speedKmh:30,freeFlowKmh:60,lengthM:1000,confidence:90,updatedAt:Date.now()}]);
          if(w.NEMAPredictive.predictRoute().segments.length!==1) throw new Error('predictive engine failed');
          w.NEMASpatial.ingest([{id:'x',type:'landmark',lat:39.9,lon:32.8,distanceM:80,name:'Kavşak'}]);
          if(w.NEMASpatial.guidance({lat:39.9,lon:32.8}).status!=='ready') throw new Error('spatial engine failed');
          w.NEMAConfidence.set('gps',95); w.NEMAConfidence.set('route',90);
          if(w.NEMAConfidence.score().score!==93) throw new Error('confidence engine failed');
          if(w.NEMAAssistant.parse('rota alternatiflerini göster').intent!=='route-options') throw new Error('assistant parser failed');
          console.log('Navigation engine v2 smoke test OK');
          NODE
