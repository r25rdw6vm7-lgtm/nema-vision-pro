name: NEMA Vision Pro Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      NEMA_URL: https://nema-vision-pro-v62-camera-extended.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/nema/vision
          mkdir -p android/app/src/main/res/layout
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NemaVisionProAndroid'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          
          android { namespace 'com.nema.vision'; compileSdk 35
              defaultConfig { applicationId 'com.nema.vision.pro'; minSdk 23; targetSdk 35; versionCode 6200; versionName '62.0.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application android:theme="@style/AppTheme" android:label="NEMA Vision Pro" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#0B7A3B</item><item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item></style></resources>
          EOF
          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" /></FrameLayout>
          EOF
          cat > android/app/src/main/java/com/nema/vision/MainActivity.java <<'EOF'
          package com.nema.vision;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int PERMS = 1001;
              private static final int FILE = 1002;
              private final String URL = "https://nema-vision-pro-v62-camera-extended.vercel.app";

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  setContentView(com.nema.vision.R.layout.activity_main);
                  webView = findViewById(com.nema.vision.R.id.webview);
                  configure();
                  requestPermissions(new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, PERMS);
                  webView.loadUrl(URL);
              }

              private void configure() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false); s.setAllowFileAccess(true); s.setAllowContentAccess(true);
                  s.setGeolocationEnabled(true); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
                  s.setUserAgentString(s.getUserAgentString()+" NEMA-Vision-Pro-Android/62");
                  webView.setWebViewClient(new WebViewClient() { @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){ return false; } });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(final PermissionRequest r) { runOnUiThread(() -> r.grant(r.getResources())); }
                      @Override public void onGeolocationPermissionsShowPrompt(String o, GeolocationPermissions.Callback cb){ cb.invoke(o,true,false); }
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p){
                          if(fileCallback!=null) fileCallback.onReceiveValue(null); fileCallback=cb;
                          Intent i=new Intent(Intent.ACTION_GET_CONTENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("image/*"); startActivityForResult(Intent.createChooser(i,"NEMA görsel seç"),FILE); return true;
                      }
                  });
              }
              @Override protected void onActivityResult(int r,int c,Intent d){ super.onActivityResult(r,c,d); if(r==FILE && fileCallback!=null){ Uri[] u=(c==RESULT_OK && d!=null && d.getData()!=null)?new Uri[]{d.getData()}:null; fileCallback.onReceiveValue(u); fileCallback=null; } }
              @Override public void onBackPressed(){ if(webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEMA-Vision-Pro-v62-Oppo-A16
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
